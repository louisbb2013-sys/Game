# Lumo standalone site on Netlify (see lumo/NETLIFY.md).
[build]
  base = "lumo"
  command = "npm run build:netlify -w @lumo/web"
  publish = "apps/web/dist-netlify"
  edge_functions = "netlify/edge-functions"
  functions = "netlify/functions"
  # Each production deploy costs credits on Netlify's free plan, so only commits whose message
  # contains "[deploy]" are published (exit 0 = skip this build).
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"

[build.environment]
  NODE_VERSION = "22"

# The app handles its own pages.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
